<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda de Envios · WhatsApp Gateway</title>
<!-- Fase 0 do redesign (ver plano em curso) — arquivos compartilhados
     linkados ANTES do <style> inline, de propósito: enquanto o bloco
     inline abaixo existir, ele vence a cascata e nada muda visualmente
     aqui. A remoção do inline (e a migração de verdade pra estes
     arquivos) acontece página por página em fases seguintes. -->
<link rel="stylesheet" href="/assets/theme.css?v=20260925">
<link rel="stylesheet" href="/assets/base.css?v=20260925">
<link rel="stylesheet" href="/assets/components.css?v=20260925">
<script src="/assets/theme-boot.js?v=20261104"></script>
<script>
  if (localStorage.getItem('sidebarCollapsed') === '1') {
    document.documentElement.classList.add('sidebar-collapsed');
  }
  // Tema claro/escuro (2026-08-30) — preferência POR NAVEGADOR (mesmo
  // padrão de sidebarCollapsed acima, localStorage puro, sem round-trip
  // ao servidor), aplicada ANTES do primeiro paint pra nunca piscar o
  // tema errado. Padrão 'dark' se nunca escolhido. Mesmo mecanismo já
  // validado em public/chat.html (HANDOFF Parte FL/FM).
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  // Paleta personalizada REMOVIDA no redesign visual (Fase 1, 2026-09-25)
  // — a paleta do app é fixa no código (public/assets/theme.css).
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17171a;
    --surface: #1f1f23;
    --surface-2: #2a2a2f;
    --border: #38383e;
    --accent: #3d8073;
    --accent-rgb: 61,128,115;
    --accent-hover: #4a9686;
    --on-accent: #ffffff;
    --gold: var(--accent);
    --gold-rgb: var(--accent-rgb);
    --gold-dim: var(--accent-hover);
    --text: #e9edef;
    --text-muted: #8696a0;
    --text-faint: #667781;
    --green: #3fb950;
    --green-rgb: 63,185,80;
    --red: #f15c6d;
    --red-rgb: 241,92,109;
    --radius: 14px;
    --footer-h: 46px;
    --header-h: 90px;
  }
  html[data-theme="light"]{
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface-2: #f5f6f6;
    --border: #e9edef;
    --accent: #3d7566;
    --accent-rgb: 61,117,102;
    --accent-hover: #2f5c50;
    --on-accent: #ffffff;
    --gold: var(--accent);
    --gold-rgb: var(--accent-rgb);
    --gold-dim: var(--accent-hover);
    --text: #111b21;
    --text-muted: #54656f;
    --text-faint: #8696a0;
    --green: #1a7f37;
    --green-rgb: 26,127,55;
    --red: #d32f2f;
    --red-rgb: 211,47,47;
  }
  :root{ --blue: #5b7a8a; }
  /* Ícones sol/lua do switch de tema (ver botão #themeToggleBtn na
     sidebar e o JS de toggle mais abaixo) — mesmo padrão de
     public/chat.html: sol visível só no tema claro, lua só no escuro,
     nunca os dois ao mesmo tempo (JS troca via classe .light-active). */
  .theme-icon-sun, .theme-icon-moon{ display:none; }
  .theme-toggle-item .theme-icon-moon{ display:block; }
  .theme-toggle-item.light-active .theme-icon-sun{ display:block; }
  .theme-toggle-item.light-active .theme-icon-moon{ display:none; }
  /* .theme-toggle-item fica FORA de .sidebar-nav (não rola com o resto da
     navegação, sempre visível) — filho direto de .sidebar. */
  .theme-toggle-item{ margin: 0 10px 8px; width: calc(100% - 20px); }
  *{ box-sizing: border-box; }

  /* Barra de rolagem com as cores do tema (em vez do cinza padrão do SO). */
  html::-webkit-scrollbar, body::-webkit-scrollbar, ::-webkit-scrollbar{ width:10px; height:10px; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, ::-webkit-scrollbar-track{ background:var(--bg); }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:100px; border:2px solid var(--bg); }
  html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:hover{ background:var(--gold-dim); }
  /* scrollbar-color/scrollbar-width (2026-08-30, bug real reportado com
     print — scrollbar cinza do SO na aba "Fotos" do painel de detalhes
     do Chat): estava só em html/body, mas essa propriedade NÃO é
     herdada de forma confiável por todo elemento com overflow próprio
     em navegadores Chromium — cada contêiner que rola precisa da
     própria declaração. Aplicado via `*` pra cobrir universalmente. */
  *{ scrollbar-color: var(--border) var(--bg); scrollbar-width: thin; }
  html, body{
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    max-width: 1180px;
    margin-left: max(var(--sidebar-w), calc((100vw + var(--sidebar-w) - 1180px) / 2));
    padding: 28px 20px 70px;
    transition: margin-left .2s ease;
    height: 100vh;
    overflow-y: auto;
    box-sizing: border-box;
  }
  html.sidebar-collapsed #app{ margin-left: max(var(--sidebar-w-collapsed), calc((100vw + var(--sidebar-w-collapsed) - 1180px) / 2)); }

  /* ======================================================
     Sidebar de navegação (retrátil) + notificações/toast
     ====================================================== */
  :root{ --sidebar-w: 236px; --sidebar-w-collapsed: 68px; }

  /* ---------- Modal "Atalhos e recursos" (2026-08-30) ----------
     Mesmo componente .overlay/.modal já usado no resto do app, só mais
     largo (o conteúdo é 2 listas de texto, não um formulário estreito).
     Replicado nas 23 páginas — CONTEÚDO específico por tela
     (SHORTCUTS_CONTENT), estrutura/comportamento idênticos: abre
     sozinho na 1ª visita de cada tela (localStorage por página, nunca
     incomoda de novo depois da 1ª vez, mesmo sem marcar o checkbox),
     reaberto a qualquer momento pelo botão fixo no topo (ⓘ), e um
     checkbox "Não mostrar automaticamente" (por página) controla só a
     abertura AUTOMÁTICA futura — o botão manual sempre continua
     funcionando independente do checkbox. */
  .shortcuts-modal .modal{ max-width: 560px; }
  .shortcuts-section{ margin-bottom: 18px; }
  .shortcuts-section:last-of-type{ margin-bottom: 10px; }
  .shortcuts-section-label{
    font-size: 10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color: var(--gold-on-light); margin-bottom: 10px;
  }
  .shortcuts-list{ display:flex; flex-direction:column; gap: 10px; }
  .shortcuts-item{ display:flex; gap: 10px; align-items:flex-start; }
  .shortcuts-item-icon{
    width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--gold);
  }
  .shortcuts-item-icon svg{ width: 15px; height: 15px; }
  .shortcuts-item-body{ min-width:0; }
  .shortcuts-item-title{ font-size: 12.5px; font-weight:600; color: var(--text); margin-bottom: 2px; }
  .shortcuts-item-desc{ font-size: 12px; color: var(--text-muted); line-height: 1.45; }
  .shortcuts-footer-check{
    display:flex; align-items:center; gap: 8px; font-size: 12px; color: var(--text-muted);
    padding-top: 14px; border-top: 1px solid var(--border); margin-top: 4px;
  }
  /* Botão fixo de reabrir na sidebar (#shortcutsReopenBtn) reaproveita
     .nav-item/.theme-toggle-item já existentes (mesmo visual do botão
     de tema logo acima) — sem classe própria nova. */


  .sidebar{
    position: fixed; top:0; left:0; bottom:0;
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column;
    transition: width .2s ease;
    z-index: 40;
    overflow: hidden;
  }
  html.sidebar-collapsed .sidebar{ width: var(--sidebar-w-collapsed); }

  .sidebar-logo{
    position:relative;
    height: var(--header-h); box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding: 8px 12px; gap:8px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .logo-mark{ width:32px; height:32px; color: var(--gold); flex-shrink:0; }
  .logo-text{ display:flex; flex-direction:column; gap:3px; }
  .logo-text .firm-name{ font-family:'Fraunces',serif; font-weight:700; font-size:12px; line-height:1.3; color:var(--gold); letter-spacing:.01em; }
  .logo-text .firm-sub{ font-family:'Inter',sans-serif; font-weight:500; font-size:8px; letter-spacing:.15em; text-transform:uppercase; color:var(--text-faint); }
  html.sidebar-collapsed .logo-text{ display:none; }
  html.sidebar-collapsed .sidebar-logo{ padding: 20px 8px; }

  .sidebar-toggle{
    position:absolute; top:20px; right:-14px;
    width:28px; height:28px; border-radius:50%;
    background:var(--gold); border:2px solid var(--bg); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:5;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    transition: transform .15s ease, filter .15s ease;
  }
  .sidebar-toggle:hover{ filter:brightness(1.08); transform: scale(1.08); }
  .sidebar-toggle svg{ width:14px; height:14px; transition: transform .2s; }
  html.sidebar-collapsed .sidebar-toggle svg{ transform: rotate(180deg); }

  .sidebar-nav{ flex:1; overflow-y:auto; overflow-x:hidden; padding: 14px 10px; display:flex; flex-direction:column; gap:2px; }
  .nav-section-label{
    font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color: var(--text-faint); padding: 14px 12px 6px;
  }
  .nav-section:first-child .nav-section-label{ padding-top:2px; }
  html.sidebar-collapsed .nav-section-label{ display:none; }
  /* Seção "Admin" (HANDOFF Parte DO) só é revelada depois de confirmar
     acesso via rede (whoami) — antes disso ela ficava com o atributo
     `hidden` (display:none), então quando a confirmação chegava a
     sidebar "pulava" de repente, ganhando altura na área que a pessoa
     já estava olhando (usuário reportou como "pisca", HANDOFF Parte
     DQ). max-height + transition troca o pulo instantâneo por uma
     expansão suave — sem atributo `hidden`, o CSS sozinho já mantém
     0px de altura até a classe `.revealed` ser adicionada via JS. */
  #navSectionAdmin{ max-height:0; overflow:hidden; transition:max-height .25s ease; }
  #navSectionAdmin.revealed{ max-height:300px; }
  /* Os 2 ITENS dentro da seção (não só o container) também precisam da
     mesma transição suave — antes usavam só o atributo `hidden`
     (display:none instantâneo). Quando os 2 fetches de whoami completam
     em momentos ligeiramente diferentes (o normal — são 2 requests
     distintos), o segundo item ainda "pulava" dentro da seção já
     expandida, mesmo depois da correção do container (usuário reportou
     de novo, HANDOFF Parte DV). Zera padding junto com max-height pra a
     expansão incluir o respiro do item, não só o conteúdo interno. */
  #navAdminItem, #navConversationAnalysisItem{
    max-height:0; overflow:hidden; padding-top:0; padding-bottom:0;
    transition: max-height .2s ease, padding .2s ease;
  }
  #navAdminItem.revealed, #navConversationAnalysisItem.revealed{
    max-height:44px; padding-top:10px; padding-bottom:10px;
  }
  .nav-item{
    position:relative;
    display:flex; align-items:center; gap:12px;
    padding: 10px 12px; border-radius:9px;
    color: var(--text-muted); text-decoration:none;
    font-size: 13px; white-space:nowrap;
    background: transparent; border:none; width:100%; text-align:left; cursor:pointer;
    font-family:'Inter',sans-serif;
    transition: background .15s, color .15s;
  }
  .nav-item:hover{ background: var(--surface-2); color: var(--text); }
  .nav-item.active{ background: rgba(var(--gold-rgb),.12); color: var(--gold); }
  .nav-icon{ display:inline-flex; flex-shrink:0; width:19px; height:19px; transition: transform .18s ease, color .18s ease; }
  .nav-item:hover .nav-icon{ transform: scale(1.16); color: var(--gold); }
  .nav-item.active .nav-icon{ color: var(--gold); }
  .nav-label{ overflow:hidden; text-overflow:ellipsis; }
  html.sidebar-collapsed .nav-label{ display:none; }
  html.sidebar-collapsed .nav-item{ justify-content:center; padding:10px; }

  .nav-tip{
    position:absolute; left: calc(100% + 10px); top:50%; transform:translateY(-50%) translateX(-4px);
    background: var(--surface-2); border:1px solid var(--border); color:var(--text);
    font-size:11.5px; padding:6px 10px; border-radius:6px; white-space:nowrap; opacity:0; pointer-events:none;
    transition: opacity .15s, transform .15s; z-index:50;
  }
  html.sidebar-collapsed .nav-item:hover .nav-tip{ opacity:1; transform:translateY(-50%) translateX(0); }
  html:not(.sidebar-collapsed) .nav-tip{ display:none; }

  /* Grupo "Landing Page" com submenu "Métricas LP" (dropdown/acordeão) —
     clicar no item principal navega normal; a seta abre/fecha o submenu,
     que fica lembrado por página (localStorage). No modo ícone (sidebar
     recolhida) o acordeão não faz sentido — mostra os dois itens sempre,
     como já era antes de virarem um grupo só. */
  .nav-group{ position:relative; }
  .nav-group > .nav-item{ padding-right:34px; }
  .nav-caret-btn{
    position:absolute; top:10px; right:6px; width:22px; height:22px; padding:0;
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:none; color:var(--text-faint); cursor:pointer; border-radius:6px;
    transition: color .15s, background .15s;
  }
  .nav-caret-btn:hover{ background:var(--surface-2); color:var(--gold); }
  .nav-caret-btn svg{ width:14px; height:14px; transition: transform .18s ease; }
  .nav-group.open .nav-caret-btn svg{ transform: rotate(180deg); }
  .nav-subitems{ display:none; flex-direction:column; }
  .nav-group.open .nav-subitems{ display:flex; }
  .nav-subitem{ padding-left:30px; font-size:12px; }
  html.sidebar-collapsed .nav-caret-btn{ display:none; }
  html.sidebar-collapsed .nav-group > .nav-item{ padding-right:10px; }
  html.sidebar-collapsed .nav-subitems{ display:flex !important; }

  .sidebar-bottom{ height: var(--footer-h); box-sizing:border-box; display:flex; align-items:center; border-top:1px solid var(--border); padding:0 10px; flex-shrink:0; gap:4px; }
  /* Botão pequeno "Ativar notificações do sistema" (Web Push) — ao lado
     do sino, em TODAS as telas com sidebar (ver HANDOFF Parte FC). Só
     ícone (tooltip explica), escondido quando a permissão já foi
     decidida ou o navegador não suporta. */
  #enableNativeNotifIconBtn{
    background:none; border:none; padding:8px; border-radius:8px; cursor:pointer;
    color:var(--text-faint); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #enableNativeNotifIconBtn:hover{ background:var(--surface-2); color:var(--gold); }
  #enableNativeNotifIconBtn svg{ width:18px; height:18px; }
  .bell-btn{ position:relative; }
  .notif-dot{
    position:absolute; top:6px; left:24px; min-width:15px; height:15px; padding:0 3px;
    border-radius:100px; background:var(--red); color:#fff; font-size:9px; font-weight:700;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  html.sidebar-collapsed .notif-dot{ left:34px; top:4px; }

  .toast-stack{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:10px; z-index:100; max-width:340px; }
  .toast{
    background: var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--gold-dim);
    color:var(--text); padding:12px 16px; border-radius:9px; font-size:12.5px; line-height:1.5;
    box-shadow:0 10px 28px rgba(0,0,0,.4); animation: toast-in .25s ease; transition: opacity .2s, transform .2s;
  }
  .toast.success{ border-left-color: var(--green); }
  .toast.error{ border-left-color: var(--red); }
  .toast.clickable{ cursor:pointer; }
  .toast.clickable:hover{ filter: brightness(1.15); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  @media (max-width: 880px){
    .sidebar{ display:none; }
    #app{ margin-left:0 !important; }
    .credit-row{ left:0; }
  }

  h1{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .subtitle{ color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }

  .toolbar-row{ display:flex; align-items:center; justify-content:space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .view-switch{ display:flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; }
  .view-switch button{ background:none; border:none; color: var(--text-muted); font-size:12.5px; padding: 7px 14px; border-radius: 7px; cursor: pointer; }
  .view-switch button.active{ background: var(--gold); color: var(--on-accent); font-weight: 600; }
  .view-switch button:not(.active):hover{ color: var(--gold); }

  .refresh-btn{
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 14px; border-radius: 9px; font-size: 12.5px; cursor: pointer;
  }
  .toolbar-row select{
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 9px; font-size: 12.5px; font-family: inherit;
  }
  .refresh-btn:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .updated-at{ color: var(--text-faint); font-size: 11.5px; margin-left: 8px; }

  .empty{ color: var(--text-faint); font-size: 13px; padding: 30px 0; text-align:center; }

  /* ---------- Kanban ---------- */
  .kanban-board{ display:flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
  .kanban-col{
    flex: 1; min-width: 240px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px;
  }
  .kanban-col.drop-target{ border-style: dashed; }
  .kanban-col.drag-over{ border-color: var(--gold); background: rgba(var(--gold-rgb),.06); }
  .kanban-col-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
  .kanban-col-title{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px; }
  .kanban-count{ background: var(--surface-2); color: var(--text-faint); font-size: 10.5px; padding: 2px 8px; border-radius: 100px; }
  .kanban-cards{ display:flex; flex-direction:column; gap: 8px; min-height: 70px; }
  .kanban-empty{ color: var(--text-faint); font-size: 11.5px; text-align:center; padding: 18px 4px; }

  .sched-card{
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; cursor: grab;
  }
  .sched-card:not([draggable="true"]){ cursor: default; }
  .sched-card.dragging{ opacity: .4; }
  .sched-card .card-name{ color: var(--text); font-weight: 500; margin-bottom: 4px; }
  .sched-card .card-name .no-name{ color: var(--text-faint); font-style: italic; font-weight: 400; }
  .sched-card .card-meta{ color: var(--text-faint); font-size: 11px; margin-bottom: 4px; }
  .sched-card .card-actions{ display:flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .sched-card .card-actions button{
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 11px; padding: 3px 8px; border-radius: 6px; cursor: pointer;
  }
  .sched-card .card-actions button:hover{ color: var(--gold); border-color: var(--gold-dim); }
  .sched-card .card-actions button.danger:hover{ color: var(--red); border-color: var(--red); }
  .mini-progress-bg{ height: 6px; border-radius: 4px; background: var(--surface); overflow: hidden; margin: 6px 0 4px; }
  .mini-progress-fill{ height: 100%; background: var(--gold); }
  .media-tag{ display:inline-block; font-size: 10px; color: var(--text-faint); }
  .retry-tag{
    display:inline-block; font-size: 10px; color: var(--gold); font-weight: 600;
    background: rgba(var(--gold-rgb),.12); border-radius: 100px; padding: 1px 7px; margin-left: 4px;
  }

  /* ---------- Calendário ---------- */
  .calendar-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px; }
  .calendar-nav-buttons{ display:flex; gap: 6px; align-items:center; }
  .calendar-nav button{
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .calendar-nav button:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .calendar-title{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; text-transform: capitalize; }

  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .calendar-weekday{ text-align:center; font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; padding-bottom: 6px; }
  .calendar-day{
    min-height: 84px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px; cursor: pointer; display:flex; flex-direction:column; gap: 3px;
  }
  .calendar-day.empty-cell{ background: transparent; border-color: transparent; cursor: default; }
  .calendar-day.today{ border-color: var(--gold-dim); }
  .calendar-day.selected{ border-color: var(--gold); background: rgba(var(--gold-rgb),.08); }
  .calendar-day:hover:not(.empty-cell){ border-color: var(--gold-dim); }
  .calendar-day .day-num{ font-size: 11px; color: var(--text-muted); }
  .calendar-chip{

<script>
(function () {
  var sidebarToggle = document.getElementById('sidebarToggle');
  if (sidebarToggle) {
    sidebarToggle.addEventListener('click', function () {
      var collapsed = document.documentElement.classList.toggle('sidebar-collapsed');
      localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0');
    });
  }

  // Toggle de tema claro/escuro (2026-08-30) — mesma preferência POR
  // NAVEGADOR de sidebarCollapsed (localStorage puro), aplicada já antes
  // do primeiro paint (ver script no <head>, data-theme). Aqui só
  // sincroniza a APARÊNCIA do botão com o estado já ativo e liga o clique.
  var themeToggleBtn = document.getElementById('themeToggleBtn');
  var themeToggleLabel = document.getElementById('themeToggleLabel');
  var themeToggleTip = document.getElementById('themeToggleTip');
  function syncThemeToggleUI() {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (themeToggleBtn) themeToggleBtn.classList.toggle('light-active', isLight);
    var label = isLight ? 'Tema escuro' : 'Tema claro';
    if (themeToggleLabel) themeToggleLabel.textContent = label;
    if (themeToggleTip) themeToggleTip.textContent = label;
  }
  syncThemeToggleUI();
  if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function () {
      var isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      }
      syncThemeToggleUI();
    });
  }

  // Modal "Atalhos e recursos" (2026-08-30, pedido do usuário replicando
  // padrão visto em outro projeto) — SHORTCUTS_CONTENT é o único trecho
  // que muda entre as 23 páginas; bindShortcutsModal() é o mecanismo
  // genérico (abrir/fechar/checkbox/1ª-visita), idêntico em todas.
  var SHORTCUTS_PAGE_KEY = 'campaign-schedule'; // usado nas chaves de localStorage — único por página
  var SHORTCUTS_CONTENT = {
    global: [
      { icon: 'esc', title: "ESC fecha tudo", desc: "Fecha qualquer modal/popover aberto — sempre a ação mais imediata primeiro." },
      { icon: 'bell', title: "Sino de notificações", desc: "Avisa (com um toast e um número no sino) sempre que chega mensagem nova, mesmo em outra tela — clique no sino leva ao histórico completo." },
      { icon: 'theme', title: "Tema claro/escuro", desc: "O botão de sol/lua na sidebar troca o tema — sua escolha fica salva neste navegador." },
      { icon: 'sidebar', title: "Sidebar retrátil", desc: "O botão redondo na borda da sidebar recolhe o menu pra só ícones — útil em telas menores." },
    ],
    page: [
      { icon: 'drag', title: "Arraste pra adiantar o envio", desc: "Na visão Kanban, arraste um card da coluna \"Agendado\" pra \"Enviar agora\" — dispara na hora, sem esperar o horário programado." },
      { icon: 'kanban', title: "Kanban ou Calendário", desc: "Alterne a visualização no topo — Kanban por status, Calendário por data." },
      { icon: 'note', title: "Reagendar", desc: "Clique num envio agendado pra mudar a data/hora numa janela." },
    ],
  };
  var SHORTCUTS_ICONS = {
    esc: '<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    theme: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2"/>',
    sidebar: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/>',
    dapinho: '<circle cx="12" cy="12" r="9"/><path d="M8 13.5s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
    note: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    insight: '<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>',
    panel: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>',
    keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    export: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
    kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/>',
    ai: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/>',
    drag: '<circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/>',
  };
  function renderShortcutsSection(label, items) {
    return `
      <div class="shortcuts-section">
        <div class="shortcuts-section-label">${label}</div>
        <div class="shortcuts-list">
          ${items.map((it) => `
            <div class="shortcuts-item">
              <span class="shortcuts-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${SHORTCUTS_ICONS[it.icon] || ''}</svg></span>
              <div class="shortcuts-item-body">
                <div class="shortcuts-item-title">${it.title}</div>
                <div class="shortcuts-item-desc">${it.desc}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
  // Mecanismo genérico (idêntico nas 23 páginas) — abre sozinho na 1ª
  // visita de CADA página (chave de localStorage própria por página, via
  // SHORTCUTS_PAGE_KEY), nunca mais incomoda depois disso mesmo sem
  // marcar o checkbox; reaberto a qualquer momento pelo botão fixo na
  // sidebar, independente do checkbox.
  function bindShortcutsModal() {
    var modal = document.getElementById('shortcutsModal');
    var body = document.getElementById('shortcutsBody');
    var checkbox = document.getElementById('shortcutsNoAutoOpen');
    var reopenBtn = document.getElementById('shortcutsReopenBtn');
    var closeBtn = document.getElementById('shortcutsCloseBtn');
    if (!modal || !body) return;
    body.innerHTML = renderShortcutsSection('Em qualquer tela', SHORTCUTS_CONTENT.global) + renderShortcutsSection('Nesta tela', SHORTCUTS_CONTENT.page);
    var seenKey = 'shortcutsSeen_' + SHORTCUTS_PAGE_KEY;
    var noAutoKey = 'shortcutsNoAutoOpen_' + SHORTCUTS_PAGE_KEY;
    if (checkbox) checkbox.checked = localStorage.getItem(noAutoKey) === '1';
    function open() { modal.classList.add('open'); }
    function close() {
      modal.classList.remove('open');
      if (checkbox) localStorage.setItem(noAutoKey, checkbox.checked ? '1' : '0');
      localStorage.setItem(seenKey, '1');
    }
    if (reopenBtn) reopenBtn.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);
    // 1ª visita desta página (nunca visto antes) — abre sozinho, a menos
    // que o usuário já tenha marcado "não mostrar automaticamente" numa
    // visita anterior (mesmo que essa marcação tenha sido feita ANTES da
    // 1ª visita ser registrada — checa os dois independentemente).
    if (localStorage.getItem(seenKey) !== '1' && localStorage.getItem(noAutoKey) !== '1') {
      open();
      // Grava "visto" já na ABERTURA automática (não só ao fechar pelo
      // botão "Entendi") — o listener global de ESC (ver mais abaixo)
      // só faz classList.remove('open') genérico em qualquer .overlay,
      // sem saber gravar chaves específicas de cada modal; sem isso, ESC
      // reabriria este modal sozinho de novo na próxima visita.
      localStorage.setItem(seenKey, '1');
    }
  }
  // O HTML do #shortcutsModal fica MAIS ABAIXO no body que este <script>
  // — chamar bindShortcutsModal() aqui direto pegava getElementById()
  // === null e a função saía no guard, deixando o modal morto em 17 das
  // 18 telas (só chat.html, com o modal antes do script, funcionava).
  // Adia a chamada pro DOM estar pronto.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindShortcutsModal);
  } else {
    bindShortcutsModal();
  }

  
  var notifDot = document.getElementById('notifDot');
  var toastStack = document.getElementById('toastStack');

  function escapeHtmlGlobal(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // O histórico de notificações agora é persistido no banco e mostrado em
  // /notifications.html (sino da sidebar virou link pra lá) — isto aqui é só
  // o aviso imediato em tela (toast). `target` (opcional): dado livre que a
  // própria página interpreta ao clicar no toast — ver window.__notifNavigate,
  // definido só nas páginas que têm "pra onde ir" (hoje, só o Chat).
  window.showToast = function (message, type, target) {
    type = type || 'info';
    if (toastStack) {
      var el = document.createElement('div');
      el.className = 'toast ' + type + (target ? ' clickable' : '');
      el.textContent = message;
      if (target && typeof window.__notifNavigate === 'function') {
        el.addEventListener('click', function () { window.__notifNavigate(target); });
      }
      toastStack.appendChild(el);
      setTimeout(function () {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(function () { el.remove(); }, 220);
      }, 4500);
    }
  };

  // Badge de não lidas no sino da sidebar (agora um link pra /notifications.html,
  // não mais um dropdown) — window.updateNotifBadge é chamado com a contagem
  // vinda de GET /notifications/unread-count assim que o login terminar (ver
  // resolveOwner() logo abaixo). window.__bumpNotifBadge soma +1 localmente —
  // só o Chat tem o socket aberto pra saber ao vivo que chegou notificação nova.
  window.updateNotifBadge = function (count) {
    if (!notifDot) return;
    if (count > 0) {
      notifDot.textContent = count > 99 ? '99+' : String(count);
      notifDot.hidden = false;
    } else {
      notifDot.hidden = true;
    }
  };
  window.__bumpNotifBadge = function () {
    var current = Number(notifDot && notifDot.textContent) || 0;
    window.updateNotifBadge(current + 1);
  };

  // Substitui confirm() nativo do navegador — mesmo visual dos outros modais
  // (.overlay/.modal/.btn já usados no resto do app). Cria o próprio DOM na
  // primeira chamada, não precisa de HTML duplicado em cada página.
  var __confirmResolve = null;
  window.confirmDialog = function (message) {
    return new Promise(function (resolve) {
      var overlay = document.getElementById('__confirmOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.id = '__confirmOverlay';
        overlay.innerHTML =
          '<div class="modal" style="max-width:340px;text-align:center;">' +
            '<h3 id="__confirmMsg" style="font-weight:500;"></h3>' +
            '<div class="modal-actions" style="justify-content:center;">' +
              '<button class="btn secondary" id="__confirmCancel">Cancelar</button>' +
              '<button class="btn" id="__confirmOk">Confirmar</button>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        overlay.querySelector('#__confirmOk').addEventListener('click', function () { __finishConfirm(true); });
        overlay.querySelector('#__confirmCancel').addEventListener('click', function () { __finishConfirm(false); });
      }
      overlay.querySelector('#__confirmMsg').textContent = message;
      overlay.classList.add('open');
      __confirmResolve = resolve;
    });
  };
  function __finishConfirm(result) {
    var overlay = document.getElementById('__confirmOverlay');
    if (overlay) overlay.classList.remove('open');
    if (__confirmResolve) { var r = __confirmResolve; __confirmResolve = null; r(result); }
  }

  // ESC fecha qualquer modal aberto (.overlay.open) — inclusive o confirmDialog,
  // que conta como "Cancelar".
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    document.querySelectorAll('.overlay.open').forEach(function (el) { el.classList.remove('open'); });
    if (__confirmResolve) { var r = __confirmResolve; __confirmResolve = null; r(false); }
  });
})();
</script>

<script>
(function () {
  const API_BASE = window.location.origin + '/api/whatsapp';
  const FETCH_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

  // BX24.getAuth() só tem dado de verdade DEPOIS que esse callback dispara —
  // chamá-lo antes devolve vazio. verifyAuth() espera essa promise pra nunca
  // rodar cedo demais, não importa de onde for chamado.
  let resolveBx24Ready;
  const bx24Ready = new Promise((resolve) => { resolveBx24Ready = resolve; });
  if (window.BX24) {
    BX24.init(() => {
      if (typeof BX24.fitWindow === 'function') BX24.fitWindow();
      resolveBx24Ready();
    });
  } else {
    resolveBx24Ready(); // deixa verifyAuth() falhar com uma mensagem clara, em vez de travar pra sempre
  }

  let appToken = null;

  // MODO DEMO (ver src/demoModeGate.js, src/demoData.js) — dados 100%
  // fictícios, sem tocar Supabase/Bitrix. Ligado via `?demo=1` na URL (o
  // gate seta um cookie e redireciona). Detectado ANTES de qualquer BX24.
  function isDemoMode() {
    return document.cookie.split(';').some((p) => p.trim() === 'demo_mode=1');
  }

  // Confirma com o backend (que por sua vez confirma com o próprio Bitrix)
  // que o access_token pertence de verdade a um usuário deste portal, e
  // devolve um token de app curto — usado em toda chamada de API daqui pra
  // frente via `Authorization: Bearer`. Ver src/auth.js.
  async function verifyAuth() {
    if (isDemoMode()) {
      const banner = document.getElementById('demoModeBanner');
      if (banner) banner.classList.add('visible');
      const res = await fetch(`${window.location.origin}/api/auth/verify`, {
        method: 'POST',
        headers: { ...FETCH_HEADERS, 'Content-Type': 'application/json' },
        body: JSON.stringify({ accessToken: 'demo-mode-token' }),
      });
      const data = await res.json();
      appToken = data.token;
      document.querySelectorAll('.firm-name').forEach((e) => { e.textContent = 'Andrade & Camargo'; });
      document.querySelectorAll('.firm-sub').forEach((e) => { e.textContent = 'Advogados Associados'; });
      return data.ownerId;
    }
    if (!window.BX24) throw new Error('abra esta página de dentro do Bitrix24');
    await bx24Ready;
    const auth = BX24.getAuth ? BX24.getAuth() : null;
    if (!auth?.access_token) { if (window.showReloadBanner) window.showReloadBanner('auth'); throw new Error('não foi possível obter o token do Bitrix'); }
    const res = await fetch(`${window.location.origin}/api/auth/verify`, {
      method: 'POST',
      headers: { ...FETCH_HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: auth.access_token }),
    });
    if (!res.ok) { if (window.showReloadBanner) window.showReloadBanner('auth'); throw new Error('falha ao autenticar com o Bitrix'); }
    const data = await res.json();
    appToken = data.token;
    return data.ownerId;
  }

  async function resolveOwner() {

    fetch(`${API_BASE}/notifications/unread-count?owner=${encodeURIComponent(ownerId)}`, { headers: { ...FETCH_HEADERS, Authorization: `Bearer ${appToken}` } })

      .catch(() => {});

  }

  async function apiFetch(url, opts = {}) {
    const doFetch = () => fetch(url, {
      ...opts,
      headers: { ...FETCH_HEADERS, Authorization: `Bearer ${appToken}`, ...(opts.headers || {}) },
    });
    let res = await doFetch();
    if (res.status === 401) {
      try {
        await verifyAuth();
        res = await doFetch();
      } catch (err) {
        console.error('[auth] falha ao reautenticar:', err.message);
        if (window.showReloadBanner) window.showReloadBanner('auth');
      }
    }
    return res;
  }

  // Web Push (Service Worker) — ícone ao lado do sino, em TODAS as telas
  // com sidebar (ver HANDOFF Parte FC). Funciona mesmo com todas as abas
  // fechadas depois de ativado, diferente do toast/sino (que exige aba
  // aberta e visível). urlBase64ToUint8Array é o snippet padrão da spec
  // Web Push (VAPID key em base64url → Uint8Array), não é específico
  // deste projeto.
  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

        const perm = await Notification.requestPermission();
        updateNativeNotifIconBtn();
        if (perm !== 'granted') return;
        const keyRes = await apiFetch(`${API_BASE}/notifications/push-public-key`);
        const { publicKey } = await keyRes.json();

          return;
        }
        const reg = await navigator.serviceWorker.register('/sw.js');
        const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
        await apiFetch(`${API_BASE}/notifications/push-subscribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subscription: sub.toJSON() }),

  let heartbeatStarted = false;

  function openPageSession() {

  // Toast de notificação em tempo real (HANDOFF Parte DG) — reaproveita o
  // heartbeat de 30s já disparado abaixo, sem canal push dedicado. "Novo"
  // é decidido comparando IDs contra um Set já visto (sessionStorage —
  // sobrevive a navegar entre as 13 telas na mesma aba, reseta numa aba
  // nova), NUNCA comparando timestamp de client com o de servidor. Primeira
  // checagem desta aba/sessão (`raw === null`) marca tudo que já está não
  // lido como "visto" SEM mostrar toast — sem isso, abrir o app com várias
  // notificações acumuladas disparava vários toasts de uma vez.
  const SEEN_NOTIF_KEY = 'seenNotifIds';
  function checkNewNotifications() {
    if (!myOwnerId) return;
    apiFetch(`${API_BASE}/notifications/latest-unread?owner=${encodeURIComponent(myOwnerId)}`)
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data) return;
        const raw = sessionStorage.getItem(SEEN_NOTIF_KEY);
        const isFirstCheck = raw === null;
        const seen = new Set(raw ? JSON.parse(raw) : []);
        (data.notifications || []).forEach((n) => {
          if (!seen.has(n.id)) {
            if (!isFirstCheck && window.showToast) window.showToast(n.title, 'info', n.target);
            seen.add(n.id);
          }
        });
        sessionStorage.setItem(SEEN_NOTIF_KEY, JSON.stringify([...seen].slice(-50)));
      })
      .catch(() => {});
  }

  function renderCard(item, { draggable } = {}) {
    const nameHtml = item.name ? escapeHtml(item.name) : '<span class="no-name">sem nome</span>';
    const mediaTag = item.mediaType ? `<span class="media-tag">📎 ${item.mediaType}</span>` : '';
    // Retry AUTOMÁTICO (criado sozinho pelo sistema após erro 463 do
    // WhatsApp, ver HANDOFF Parte CN) — só um selo visual, não muda edição/
    // cancelamento nenhum: cancela/reagenda igual a qualquer outro card.
    const retryTag = item.retryOfCampaignId ? '<span class="retry-tag">↻ Retry automático</span>' : '';

    let body = '';
    if (item.status === 'scheduled') {
      body = `
        <div class="card-meta">📅 ${formatDateTime(item.scheduledAt)} · ${item.recipientsCount} destinatário${item.recipientsCount === 1 ? '' : 's'} ${mediaTag}</div>
        <div class="card-actions">
          <button type="button" data-send-now="${item.id}">Enviar agora</button>
          <button type="button" data-reschedule="${item.id}">Reagendar</button>
          <button type="button" class="danger" data-cancel="${item.id}">Cancelar</button>
        </div>
      `;
    } else if (item.status === 'sending') {
      const total = item.totalCount || item.recipientsCount || 1;
      const done = (item.sentCount || 0) + (item.failedCount || 0);
      const pct = Math.round((done / total) * 100);
      body = `
        <div class="card-meta">Enviando desde ${formatDateTime(item.scheduledAt)}</div>
        <div class="mini-progress-bg"><div class="mini-progress-fill" style="width:${pct}%"></div></div>
        <div class="card-meta">${item.sentCount || 0} enviadas · ${item.failedCount || 0} falharam · ${total} total</div>
      `;
    } else if (item.status === 'sent') {
      body = `
        <div class="card-meta">${item.sentCount || 0} enviadas · ${item.failedCount || 0} falharam · ${item.totalCount || item.recipientsCount} total ${mediaTag}</div>
        <div class="card-meta">Concluída em ${item.finishedAt ? formatDateTime(item.finishedAt) : '—'}</div>
      `;
    } else if (item.status === 'canceled') {
      body = `<div class="card-meta">Cancelada · seria em ${formatDateTime(item.scheduledAt)}</div>`;
    }

    return `
      <div class="sched-card" ${draggable ? 'draggable="true"' : ''} data-id="${item.id}" data-status="${item.status}">
        <div class="card-name">${nameHtml}${retryTag}</div>
        ${body}
      </div>
    `;
  }

  const MONTH_LABELS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function renderCalendar() {
    const year = calRefDate.getFullYear();
    const month = calRefDate.getMonth();

    const byDay = new Map();
    items.forEach((item) => {
      const key = dayKey(item.scheduledAt);
      if (!byDay.has(key)) byDay.set(key, []);
      byDay.get(key).push(item);
    });

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay(); // 0 = domingo
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const todayKey = dayKey(new Date().toISOString());

    let cells = '';
    for (let i = 0; i < startOffset; i++) {
      cells += `<div class="calendar-day empty-cell"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const pad = (n) => String(n).padStart(2, '0');
      const key = `${year}-${pad(month + 1)}-${pad(day)}`;
      const dayItems = (byDay.get(key) || []).slice().sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt));
      const shown = dayItems.slice(0, 3);
      const extra = dayItems.length - shown.length;

      cells += `
        <div class="calendar-day ${key === todayKey ? 'today' : ''} ${key === selectedDayKey ? 'selected' : ''}" data-day="${key}">
          <span class="day-num">${day}</span>
          ${shown.map((i) => `<span class="calendar-chip ${i.status}">${escapeHtml(i.name || i.recipientsCount + ' destinatários')}</span>`).join('')}
          ${extra > 0 ? `<span class="calendar-more">+${extra} mais</span>` : ''}
        </div>
      `;
    }

    calendarView.innerHTML = `
      <div class="calendar-nav">
        <span class="calendar-title">${MONTH_LABELS[month]} ${year}</span>
        <div class="calendar-nav-buttons">
          <button type="button" id="calPrev">‹</button>
          <button type="button" id="calToday">Hoje</button>
          <button type="button" id="calNext">›</button>
        </div>
      </div>
      <div class="calendar-grid">
        ${WEEKDAY_LABELS.map((w) => `<div class="calendar-weekday">${w}</div>`).join('')}
        ${cells}
      </div>
      <div id="dayAgendaWrap"></div>
    `;

    document.getElementById('calPrev').addEventListener('click', () => {
      calRefDate = new Date(year, month - 1, 1);
      renderCalendar();
    });
    document.getElementById('calNext').addEventListener('click', () => {
      calRefDate = new Date(year, month + 1, 1);
      renderCalendar();
    });
    document.getElementById('calToday').addEventListener('click', () => {
      calRefDate = new Date();
      renderCalendar();
    });

    calendarView.querySelectorAll('.calendar-day[data-day]').forEach((el) => {
      el.addEventListener('click', () => {
        selectedDayKey = selectedDayKey === el.dataset.day ? null : el.dataset.day;
        renderCalendar();
      });
    });

    renderDayAgenda(byDay);
  }

  function renderDayAgenda(byDay) {
    const wrap = document.getElementById('dayAgendaWrap');
    if (!selectedDayKey) { wrap.innerHTML = ''; return; }

    const dayItems = (byDay.get(selectedDayKey) || []).slice().sort((a, b) => a.scheduledAt.localeCompare(b.scheduledAt));
    const [y, m, d] = selectedDayKey.split('-');
    const label = `${d}/${m}/${y}`;

    wrap.innerHTML = `
      <div class="day-agenda">
        <h2>Agendamentos de ${label}</h2>
        <div class="cards-list">
          ${dayItems.length ? dayItems.map((item) => renderCard(item, { draggable: false })).join('') : '<p class="empty">Nada agendado nesse dia.</p>'}
        </div>
      </div>
    `;
    bindCardActions(wrap);
  }

  initInstances();
  setInterval(load, 15000);
})();
</script>
<script>
(function () {
  fetch('/api/brand').then(function (r) { return r.json(); }).then(function (b) {
    if (b.name) document.querySelectorAll('.firm-name').forEach(function (el) { el.textContent = b.name; });
    if (b.subtitle) document.querySelectorAll('.firm-sub').forEach(function (el) { el.textContent = b.subtitle; });
  }).catch(function () {});
})();
</script>
<script>
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('#creditBadgeBtn');
    if (!btn || !window.BX24 || typeof BX24.openPath !== 'function') return;
    BX24.openPath('/company/personal/user/5305/');
  });
</script>
</body>
