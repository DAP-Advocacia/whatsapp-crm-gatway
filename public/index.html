<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp · Negócio</title>
<script>
  // Tema claro/escuro (2026-08-30) — preferência POR NAVEGADOR (mesmo
  // padrão de localStorage puro das outras 21 telas), aplicada ANTES do
  // primeiro paint. Esta página não tem sidebar (é o mini-chat embutido
  // no card do Negócio/Contato do Bitrix) — o switch fica no header do
  // chat (ver #themeToggleBtn em renderChat()).
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  // Paleta customizada (tela Configurações) — aplica do cache local ANTES
  // do primeiro paint, pra não piscar a cor padrão antes da de verdade
  // chegar (o fetch de /api/brand mais abaixo é assíncrono). Esse mesmo
  // fetch atualiza o cache pra próxima navegação ficar sem flash também.
  (function () {
    // `bg` (e --surface/--surface-2/--border derivadas dela) SAIU deste
    // mapa em 2026-08-30 — fundo agora é responsabilidade EXCLUSIVA do
    // tema claro/escuro, nunca mais da paleta pessoal (mesmo fix já
    // validado em public/chat.html, HANDOFF Parte FL). Nota: esta página
    // só usa o prefixo 'palette_' (brand global) — nunca recebeu a
    // paleta PESSOAL por usuário que as outras 21 telas têm (limitação
    // pré-existente, fora do escopo desta correção de tema).
    var MAP = { gold: '--gold', goldDim: '--gold-dim', green: '--green', red: '--red' };
    var RGB_MAP = { gold: '--gold-rgb', green: '--green-rgb', red: '--red-rgb' };
    function hexToRgbStr(hex) {
      var n = parseInt(hex.slice(1), 16);
      return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
    }
    window.__applyPalette = function (b) {
      var values = { gold: b.color, goldDim: b.colorDim, green: b.green, red: b.red };
      Object.keys(MAP).forEach(function (k) {
        if (values[k]) {
          document.documentElement.style.setProperty(MAP[k], values[k]);
          localStorage.setItem('palette_' + k, values[k]);
          if (RGB_MAP[k]) {
            var rgbStr = hexToRgbStr(values[k]);
            document.documentElement.style.setProperty(RGB_MAP[k], rgbStr);
            localStorage.setItem('palette_' + k + '_rgb', rgbStr);
          }
        } else {
          document.documentElement.style.removeProperty(MAP[k]);
          localStorage.removeItem('palette_' + k);
          if (RGB_MAP[k]) {
            document.documentElement.style.removeProperty(RGB_MAP[k]);
            localStorage.removeItem('palette_' + k + '_rgb');
          }
        }
      });
    };
    Object.keys(MAP).forEach(function (k) {
      var cached = localStorage.getItem('palette_' + k);
      if (cached) document.documentElement.style.setProperty(MAP[k], cached);
      if (RGB_MAP[k]) {
        var cachedRgb = localStorage.getItem('palette_' + k + '_rgb');
        if (cachedRgb) document.documentElement.style.setProperty(RGB_MAP[k], cachedRgb);
      }
    });
    // Cache ÓRFÃO de uma versão anterior (bg/surface/surface2/border
    // salvos antes do tema claro existir) — limpo aqui, uma vez.
    ['bg', 'surface', 'surface2', 'border'].forEach(function (k) {
      localStorage.removeItem('palette_' + k);
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15120d;
    --surface: #1d1812;
    --surface-2: #241d15;
    --border: #34291a;
    --gold: #d8ab4f;
    --gold-rgb: 216,171,79;
    --gold-dim: #8a6b32;
    --text: #f3ede2;
    --text-muted: #a89a83;
    --text-faint: #6e6353;
    --green: #4caf6e;
    --green-rgb: 76,175,110;
    --red: #d9685f;
    --red-rgb: 217,104,95;
    --radius: 14px;
    --bubble-mine: var(--gold);
    --bubble-mine-text: #1a1408;
    --bubble-theirs: #261f16;
    --gold-on-light: var(--gold);
  }
  /* Tema claro (2026-08-30) — mesmo bloco-base de public/chat.html
     (HANDOFF Parte FL/FM), incluindo --bubble-theirs (bolha do contato)
     e --gold-on-light (contraste de --gold como texto no tema claro). */
  html[data-theme="light"]{
    --bg: #f7f4ee;
    --surface: #ffffff;
    --surface-2: #eee8db;
    --border: #ddd4c0;
    --text: #2a2318;
    --text-muted: #6b6152;
    --text-faint: #9a8f7a;
    --bubble-mine-text: #1a1408;
    --bubble-theirs: #fbfaf7;
    --gold-on-light: #8a6018;
  }

  *{ box-sizing: border-box; }

  /* Barra de rolagem com as cores do tema (em vez do cinza padrão do SO) —
     regra global; os seletores mais específicos abaixo (.messages,
     .composer textarea) continuam valendo por cima dela. */
  html::-webkit-scrollbar, body::-webkit-scrollbar, ::-webkit-scrollbar{ width:10px; height:10px; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, ::-webkit-scrollbar-track{ background:var(--bg); }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:100px; border:2px solid var(--bg); }
  html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:hover{ background:var(--gold-dim); }
  /* scrollbar-color/scrollbar-width (2026-08-30, bug real reportado com
     print — scrollbar cinza do SO na aba "Fotos" do painel de detalhes
     do Chat): estava só em html/body, mas essa propriedade NÃO é
     herdada de forma confiável por todo elemento com overflow próprio
     em navegadores Chromium — cada contêiner que rola precisa da
     própria declaração. Aplicado via `*` pra cobrir universalmente. */
  *{ scrollbar-color: var(--border) var(--bg); scrollbar-width: thin; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app{
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  .chat-header{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .avatar{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--gold);
    flex-shrink: 0;
  }

  .header-info{ min-width: 0; flex: 1; }

  .header-info .name{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-info .meta{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .status-dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
    position: relative;
  }
  .status-dot.online{ background: var(--green); }
  .status-dot.online::after{
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 1px solid var(--green);
    opacity: 0.5;
    animation: pulse 2s ease-out infinite;
  }
  .status-dot.offline{ background: var(--red); }

  @keyframes pulse{
    0%{ transform: scale(0.8); opacity: 0.6; }
    100%{ transform: scale(1.8); opacity: 0; }
  }

  .header-actions{ display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

  .instance-select{
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    padding: 0 8px;
    cursor: pointer;
    max-width: 130px;
  }
  .instance-select:hover, .instance-select:focus{ border-color: var(--gold-dim); color: var(--gold); outline: none; }

  .icon-btn{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .icon-btn:hover{ border-color: var(--gold-dim); color: var(--gold); }
  .icon-btn svg{ width: 17px; height: 17px; }
  .icon-btn.recording{ background: var(--red); border-color: var(--red); color: #fff; animation: recPulse 1.2s ease-in-out infinite; }
  @keyframes recPulse{ 0%,100%{ opacity: 1; } 50%{ opacity: .6; } }
  /* Ícones sol/lua do switch de tema (2026-08-30) — mesmo padrão das
     outras telas: sol visível só no tema claro, lua só no escuro. */
  .theme-icon-sun, .theme-icon-moon{ display:none; }
  .theme-toggle-btn .theme-icon-moon{ display:block; }
  .theme-toggle-btn.light-active .theme-icon-sun{ display:block; }
  .theme-toggle-btn.light-active .theme-icon-moon{ display:none; }

  /* ---------- Messages ---------- */
  .messages{
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
    background-size: 22px 22px;
  }

  .messages::-webkit-scrollbar{ width: 8px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 4px; }

  .day-divider{
    align-self: center;
    font-size: 11px;
    color: var(--text-faint);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 100px;
    margin: 14px 0 10px;
    letter-spacing: .03em;
    text-transform: uppercase;
  }

  .bubble-row{ display: flex; align-items: flex-end; gap: 4px; margin: 3px 0; }
  .bubble-row.mine{ justify-content: flex-end; }
  .bubble-row.theirs{ justify-content: flex-start; }
  .bubble-row.has-reaction{ margin-bottom: 14px; }

  .reaction-badge{
    position: absolute; bottom: -11px; right: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 100px;
    padding: 1px 6px; font-size: 13px; line-height: 1.4; box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .bubble-row.theirs .reaction-badge{ right: auto; left: 10px; }
  .reaction-badge--mine{ cursor: pointer; }
  .reaction-badge--mine:hover{ filter: brightness(1.3); }

  /* Reagir/Responder — barra que aparece ao passar o mouse na mensagem. */
  .bubble-actions-wrap{ display: none; align-items: center; gap: 3px; padding-bottom: 6px; flex-shrink: 0; }
  .bubble-row:hover .bubble-actions-wrap, .bubble-actions-wrap.picker-open{ display: flex; }
  .bubble-action-btn{
    width: 25px; height: 25px; border-radius: 50%; border: none; background: var(--surface-2);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 12.5px; padding: 0; transition: background .15s, color .15s;
  }
  .bubble-action-btn:hover{ background: var(--gold-dim); color: var(--bg); }
  .emoji-picker{ display: flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 100px; padding: 3px; }
  .emoji-opt{ width: 25px; height: 25px; border: none; background: none; font-size: 15px; cursor: pointer; border-radius: 50%; }
  .emoji-opt:hover{ background: var(--surface); transform: scale(1.15); }

  /* Mensagem citada ("responder") */
  .quoted-block{
    border-left: 3px solid var(--gold-dim); background: rgba(0,0,0,.14); border-radius: 6px;
    padding: 5px 8px; margin-bottom: 6px; font-size: 12px; line-height: 1.3; cursor: pointer;
  }
  .bubble-row.theirs .quoted-block{ background: rgba(255,255,255,.06); border-left-color: var(--gold); }
  .quoted-author{ font-weight: 600; color: var(--gold); margin-bottom: 1px; font-size: 11.5px; }
  .quoted-text{
    opacity: .8; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .quoted-block--unknown{ font-style: italic; opacity: .65; cursor: default; }
  .bubble-row.flash .bubble{ outline: 2px solid var(--gold); outline-offset: 1px; }

  /* Barra "Respondendo a…" acima do composer */
  .reply-preview-bar{
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--surface-2); border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .reply-preview-bar[hidden]{ display: none; }
  .reply-preview-bar .bar-icon{ color: var(--gold); flex-shrink: 0; }
  .reply-preview-body{ flex: 1; min-width: 0; }
  .reply-preview-author{ font-size: 11.5px; font-weight: 600; color: var(--gold); }
  .reply-preview-text{ font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .bubble{
    /* reduzido de 72% — ficava enorme em telas largas (mesmo ajuste feito
       em chat.html); teto em px porque esta página roda embutida num
       card do Bitrix, com largura variável dependendo do layout do CRM. */
    max-width: min(60%, 480px);
    padding: 9px 12px 8px;
    font-size: 13.5px;
    line-height: 1.45;
    border-radius: var(--radius);
    word-wrap: break-word;
    white-space: pre-wrap;
    position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }

  .bubble-row.theirs .bubble{
    background: var(--bubble-theirs);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }
  .bubble code{ background:rgba(255,255,255,.08); padding:1px 4px; border-radius:4px; font-family:'SFMono-Regular', Consolas, monospace; font-size:.92em; }

  .bubble-row.mine .bubble{
    background: var(--bubble-mine);
    color: var(--bubble-mine-text);
    border-bottom-right-radius: 3px;
  }

  .bubble .timestamp{
    display: block;
    text-align: right;
    font-size: 10px;
    margin-top: 4px;
    opacity: .6;
    font-variant-numeric: tabular-nums;
  }

  .bubble .ticks{ margin-left: 4px; }

  /* Prévia de link (Open Graph) — mesmo conceito do WhatsApp/Slack ao
     detectar uma URL no texto da mensagem. */
  .msg-link{ color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  .link-preview{
    display: block; margin-top: 6px; border-radius: 10px; overflow: hidden;
    background: rgba(0,0,0,.14); border: 1px solid rgba(0,0,0,.16);
    text-decoration: none; color: inherit;
  }
  .bubble-row.theirs .link-preview{ background: var(--surface-2); border-color: var(--border); }
  .link-preview-img{ display: block; width: 100%; max-height: 140px; object-fit: cover; background: var(--surface-2); }
  .link-preview-body{ padding: 7px 10px; }
  .link-preview-title{ font-size: 12.5px; font-weight: 600; line-height: 1.3; margin-bottom: 2px; }
  .link-preview-desc{
    font-size: 11.5px; opacity: .75; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .link-preview-site{ font-size: 10px; opacity: .6; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; }
  .link-preview-loading{ display: block; margin-top: 6px; font-size: 11px; opacity: .55; font-style: italic; }

  /* ---------- Empty / loading / error states ---------- */
  .state-screen{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 30px;
    text-align: center;
    color: var(--text-muted);
  }

  .state-screen .state-icon{
    width: 46px; height: 46px;
    color: var(--gold-dim);
  }

  .state-screen h3{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--text);
    margin: 4px 0 0;
  }

  .state-screen p{ font-size: 12.5px; max-width: 280px; margin: 0; color: var(--text-faint); }

  .spinner{
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--gold);
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .retry-btn{
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 7px 16px;
    border-radius: 9px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .retry-btn:hover{ background: rgba(var(--gold-rgb),.08); }

  /* ---------- Composer ---------- */
  .composer{
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 14px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .composer textarea{
    flex: 1;
    resize: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 10px 12px;
    max-height: 110px;
    min-height: 40px;
    line-height: 1.4;
    outline: none;
    transition: border-color .15s;
  }
  .composer textarea:focus{ border-color: var(--gold-dim); }
  .composer textarea::placeholder{ color: var(--text-faint); }
  .composer textarea::-webkit-scrollbar{ width: 6px; }
  .composer textarea::-webkit-scrollbar-track{ background: transparent; }
  .composer textarea::-webkit-scrollbar-thumb{ background: var(--gold-dim); border-radius: 100px; }
  .composer textarea::-webkit-scrollbar-thumb:hover{ background: var(--gold); }

  .send-btn{
    width: 40px;
    height: 40px;
    border-radius: 11px;
    border: none;
    background: var(--gold);
    color: #1a1408;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: filter .15s, transform .1s;
  }
  .send-btn:hover{ filter: brightness(1.08); }
  .send-btn:active{ transform: scale(.93); }
  .send-btn:disabled{ background: var(--surface-2); color: var(--text-faint); cursor: not-allowed; }
  .send-btn svg{ width: 17px; height: 17px; }

  .composer-hint{
    font-size: 10.5px;
    color: var(--text-faint);
    padding: 0 14px 10px;
    background: var(--surface);
  }

  .disconnected-banner{
    background: rgba(var(--red-rgb),.12);
    border-top: 1px solid rgba(var(--red-rgb),.3);
    color: #e89c95;
    font-size: 12px;
    padding: 8px 14px;
    text-align: center;
    flex-shrink: 0;
  }

  .credit-row{
    display: flex;
    justify-content: center;
    padding: 8px 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .credit-badge{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 13px;
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    white-space: nowrap;
  }
  .credit-badge:hover{ color: var(--gold); border-color: var(--gold-dim); }
  .credit-badge .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    flex-shrink: 0;
  }

  /* Avisos (nunca alert()/confirm() nativo — sempre esse toast). */
  .toast-stack{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:10px; z-index:100; max-width:340px; }
  .toast{
    background: var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--gold-dim);
    color:var(--text); padding:12px 16px; border-radius:9px; font-size:12.5px; line-height:1.5;
    box-shadow:0 10px 28px rgba(0,0,0,.4); animation: toast-in .25s ease; transition: opacity .2s, transform .2s;
  }
  .toast.success{ border-left-color: var(--green); }
  .toast.error{ border-left-color: var(--red); }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }

  /* ---------- Grupo de card (feature "Criar grupo") + Nota interna ---------- */
  /* Switch Cliente/Grupo no cabeçalho — só aparece quando já existe um
     grupo de card criado pra este negócio (ver loadCardGroup). */
  .view-switch{
    display: flex; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 100px; padding: 2px; flex-shrink: 0;
  }
  .view-switch button{
    border: none; background: none; color: var(--text-muted); font-family: inherit;
    font-size: 11.5px; padding: 6px 12px; border-radius: 100px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .view-switch button.active{ background: var(--gold); color: #1a1408; font-weight: 600; }
  .view-switch button:not(.active):hover{ color: var(--gold); }

  .icon-btn.has-notes{ border-color: var(--gold-dim); color: var(--gold); }

  /* Overlay/modal — mesmo padrão visual de chat.html (.overlay/.modal),
     replicado aqui (index.html não importa CSS/JS de outra tela). */
  .overlay{
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex;
    align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  /* O JS desta tela liga/desliga os overlays via `.hidden` (atributo). O
     atributo `hidden` sozinho não vence o `display: flex` de autor acima
     (regra do user-agent tem prioridade menor), então o modal ficava
     preso na tela sem conseguir fechar — precisa da regra explícita. */
  .overlay[hidden]{ display: none; }
  .modal{
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
    width: 100%; max-width: 420px; max-height: 85vh; display: flex; flex-direction: column;
    overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .modal-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .modal-head h3{ font-size: 15px; margin: 0; }
  .modal-close{ background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 18px; padding: 2px 6px; }
  .modal-close:hover{ color: var(--text); }
  .modal-body{ padding: 16px 18px; overflow-y: auto; flex: 1; }
  .modal-actions{
    display: flex; justify-content: flex-end; gap: 10px; padding: 14px 18px;
    border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .modal input[type="text"]{
    width: 100%; height: 38px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-family: inherit; font-size: 13px;
    padding: 0 12px; margin-bottom: 14px;
  }
  .modal input[type="text"]:focus{ outline: none; border-color: var(--gold-dim); }
  .modal label.field-label{ display: block; font-size: 11.5px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .btn-primary{
    background: var(--gold); color: #1a1408; border: none; border-radius: 9px;
    padding: 9px 18px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .btn-primary:disabled{ opacity: .5; cursor: not-allowed; }
  .btn-secondary{
    background: none; color: var(--text-muted); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 18px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .btn-secondary:hover{ color: var(--text); border-color: var(--gold-dim); }

  .participant-row{
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .participant-row:last-child{ border-bottom: none; }
  .participant-role{ font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .03em; }
  .participant-name{ font-size: 13px; color: var(--text); }
  .participant-phone{ font-size: 11.5px; color: var(--text-muted); }
  .participant-missing{ font-size: 11.5px; color: var(--red); }

  /* Bolha recebida num grupo tem N remetentes possíveis (DM sempre teve
     só 1) — nome de quem mandou aparece acima da bolha, só no modo grupo. */
  .group-sender-label{
    font-size: 11px; color: var(--gold-dim); font-weight: 600; margin: 0 0 3px 2px;
  }

  /* Drawer de nota interna — visual DELIBERADAMENTE distinto de mensagem
     real (fundo âmbar, ícone de cadeado), pra nunca ser confundido com
     algo que o cliente também vê. */
  .notes-drawer{
    position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 360px;
    background: var(--bg); border-left: 1px solid var(--border); z-index: 190;
    display: flex; flex-direction: column; box-shadow: -20px 0 60px rgba(0,0,0,.4);
  }
  .notes-drawer-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .notes-drawer-head h3{ font-size: 14px; margin: 0; }
  .notes-drawer-warning{
    background: rgba(216,171,79,.08); border-bottom: 1px solid var(--border);
    color: var(--gold-dim); font-size: 11px; padding: 8px 18px; flex-shrink: 0;
  }
  .notes-list{ flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .note-item{
    background: rgba(216,171,79,.07); border: 1px solid rgba(216,171,79,.22);
    border-radius: 10px; padding: 10px 12px;
  }
  .note-item-author{ font-size: 11px; color: var(--gold-dim); font-weight: 600; margin-bottom: 3px; display:flex; align-items:center; gap:6px; }
  .note-item-author span{ flex:1; }
  .note-item-text{ font-size: 13px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .note-item-time{ font-size: 10.5px; color: var(--text-faint); margin-top: 5px; }

  /* Editar/concluir nota interna — concluída continua no MESMO lugar
     cronológico da lista, só riscada/opaca (decisão do usuário). */
  .note-item--done{ opacity:.55; }
  .note-item--done .note-item-text{ text-decoration: line-through; text-decoration-color: var(--gold-dim); }
  .note-action-btn{ background:none; border:none; color:var(--gold-dim); cursor:pointer; font-size:12px; padding:2px 4px; opacity:.6; flex-shrink:0; }
  .note-action-btn:hover{ opacity:1; }
  .note-edited-tag{ background:none; border:none; color:var(--text-faint); font-size:10px; text-decoration:underline; cursor:pointer; padding:0; font-family:inherit; }
  .note-item--editing{ background: rgba(216,171,79,.1); border-radius:10px; padding:10px 12px; border:1px solid rgba(216,171,79,.3); }
  .note-item-edit-input{
    width:100%; resize:vertical; min-height:60px; border-radius:8px; font-size:13px; padding:8px 10px;
    border:1px solid rgba(216,171,79,.35); background:rgba(216,171,79,.06); color:var(--text); font-family:inherit;
  }
  .note-item-edit-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
  .rev-item{ padding:8px 0; border-bottom:1px solid var(--border); }
  .rev-item:last-child{ border-bottom:none; }
  .rev-text{ font-size:12.5px; color:var(--text); white-space:pre-wrap; word-break:break-word; }
  .rev-time{ font-size:10px; color:var(--text-faint); margin-top:3px; }
  .notes-composer{
    display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .notes-composer textarea{
    flex: 1; resize: none; border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); border-radius: 9px; padding: 8px 12px; font-family: inherit; font-size: 13px;
    max-height: 90px;
  }
  .notes-composer textarea:focus{ outline: none; border-color: var(--gold-dim); }
</style>
</head>
<body>

<div class="toast-stack" id="toastStack"></div>

<div id="app">
  <!-- Estado inicial: carregando contexto do negócio -->
  <div class="state-screen" id="loadingState">
    <div class="spinner"></div>
    <h3>Carregando conversa…</h3>
    <p>Buscando os dados do negócio e o histórico no WhatsApp.</p>
  </div>
</div>

<!-- Modal "Criar grupo" — feature de grupo por card do negócio.
     Conteúdo real montado dinamicamente por renderCreateGroupModal(). -->
<div class="overlay" id="createGroupOverlay" hidden>
  <div class="modal" id="createGroupModal"></div>
</div>

<!-- Drawer de nota interna — visível SÓ para internos, nunca enviada ao
     WhatsApp (ver src/routes/internalNotes.js). Conteúdo montado por
     renderNotesDrawer(). -->
<div class="notes-drawer" id="notesDrawer" hidden></div>

<!-- Histórico de EDIÇÕES de uma nota interna — texto anterior a cada
     versão substituída, nunca "sobrescreve e pronto" (pedido do
     usuário). Conteúdo secundário sob demanda, montado por
     showNoteRevisions(). -->
<div class="overlay" id="noteRevisionsModal" hidden>
  <div class="modal">
    <div class="modal-head"><h3>Histórico de edições</h3><button class="modal-close" id="noteRevisionsCloseBtn" type="button">&times;</button></div>
    <div class="modal-body" id="noteRevisionsList"></div>
  </div>
</div>

<script src="https://api.bitrix24.com/api/v1/"></script>
<script>
(function () {

  // =========================================================
  // CONFIGURAÇÃO — ajuste para o endereço real do seu backend
  // =========================================================
  const API_BASE = window.location.origin + '/api/whatsapp';
  // Raiz de /api, sem o sufixo /whatsapp — usada pelas rotas novas de
  // "Criar grupo" (/api/card-group) e nota interna (/api/internal-notes),
  // que vivem em routers próprios (ver src/routes/cardGroup.js,
  // src/routes/internalNotes.js), não dentro de routes/whatsapp.js.
  const API_ROOT = window.location.origin + '/api';

  // O ngrok grátis intercepta requisições do navegador com uma página
  // de aviso (HTML), o que faz o res.json() quebrar. Este header pula
  // esse aviso. Em domínio próprio/produção é inofensivo.
  const FETCH_HEADERS = { 'ngrok-skip-browser-warning': 'true' };

  // Confirma com o backend (que por sua vez confirma com o próprio Bitrix)
  // que o access_token pertence de verdade a um usuário deste portal, e
  // devolve um token de app curto — usado em toda chamada de API daqui pra
  // frente via `Authorization: Bearer`. Ver src/auth.js.
  async function verifyAuth() {
    const auth = BX24.getAuth ? BX24.getAuth() : null;
    if (!auth?.access_token) throw new Error('não foi possível obter o token do Bitrix');
    const res = await fetch(`${window.location.origin}/api/auth/verify`, {
      method: 'POST',
      headers: { ...FETCH_HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessToken: auth.access_token }),
    });
    if (!res.ok) throw new Error('falha ao autenticar com o Bitrix');
    const data = await res.json();
    state.appToken = data.token;
    return data.ownerId;
  }

  async function apiFetch(url, opts = {}) {
    const doFetch = () => fetch(url, {
      ...opts,
      headers: { ...FETCH_HEADERS, Authorization: `Bearer ${state.appToken}`, ...(opts.headers || {}) },
    });
    let res = await doFetch();
    if (res.status === 401) {
      try {
        await verifyAuth();
        res = await doFetch();
      } catch (err) {
        console.error('[auth] falha ao reautenticar:', err.message);
      }
    }
    return res;
  }

  const app = document.getElementById('app');

  const state = {
    // 'deal' (aba de Negócio) ou 'contact' (aba de Contato, HANDOFF Parte
    // DE) — só um de dealId/contactId fica preenchido por vez, nunca os
    // dois juntos.
    entityType: null,
    dealId: null,
    contactId: null,
    appToken: null,        // token de app (ver verifyAuth) — mandado em toda chamada de API
    ownerId: null,        // usuário do Bitrix (member_id + user id) — pode ter várias instâncias
    instances: [],        // instâncias de WhatsApp desse usuário
    session: null,        // id da instância selecionada no momento (usada em toda chamada de API)
    phone: null,
    contactName: null,
    messages: [],
    connectionStatus: 'unknown', // 'online' | 'offline' | 'connecting' | 'unknown'
    peerPresence: null,    // null | 'composing' | 'recording' — do CONTATO, ao vivo
    peerPresenceTimer: null,
    replyingTo: null,      // { id, text, type, direction } — mensagem sendo citada na próxima resposta
    socket: null,
    qrTimer: null,
    // Grupo de card (feature "Criar grupo") já existente pra este negócio,
    // se houver — { id, name, ... } | null. Alimenta o switch Cliente/Grupo
    // no cabeçalho (ver renderChat/loadCardGroup).
    cardGroup: null,
    // 'client' (padrão, comportamento de sempre) | 'group' — qual "phone"
    // está carregado no momento. clientPhone guarda o telefone do CLIENTE
    // sempre (mesmo quando viewMode='group', state.phone vira o JID do
    // grupo) — necessário pra "voltar" pro modo Cliente sem perder o
    // telefone original.
    viewMode: 'client',
    clientPhone: null,
    internalNotesOpen: false,
    internalNotes: [],
  };

  // Emoji de reação com o picker aberto no momento (só um por vez).
  let openReactionPickerId = null;
  const QUICK_EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];

  // Nome do usuário atual — usado só como rótulo de autor ao adicionar uma
  // nota interna (mesmo padrão de chat.html::myBitrixName, ver
  // submitInternalNote). Best-effort: sem BX24/erro, fica null e a nota
  // é criada sem nome de autor (author_owner_id do backend continua
  // preenchido de qualquer forma, ver src/routes/internalNotes.js).
  let myBitrixName = null;
  function fetchMyBitrixName() {
    if (!window.BX24) return;
    BX24.callMethod('user.current', {}, (result) => {
      if (result.error()) return;
      const u = result.data();
      myBitrixName = [u.NAME, u.LAST_NAME].filter(Boolean).join(' ') || null;
    });
  }

  // Lembra qual instância foi escolhida pra cada negócio (só importa quando
  // o usuário tem mais de uma) — assim reabrir a mesma conversa não obriga a
  // escolher de novo toda hora.
  // Genérico (era só "deal" antes) — agora também abre de dentro do card
  // de Contato (HANDOFF Parte DE), precisa de uma chave própria pra não
  // colidir com o mesmo ID numérico que, por coincidência, também exista
  // como dealId em outro contexto.
  function instanceStorageKey(entityType, id) {
    return `wa-instance-${entityType}-${id}`;
  }

  // ---------------------------------------------------------
  // Helpers de UI
  // ---------------------------------------------------------
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  // Nunca alert()/confirm() nativo — sempre esse toast (mesmo padrão de
  // chat.html/dashboard.html etc.).
  const toastStack = document.getElementById('toastStack');
  function showToast(message, type) {
    if (!toastStack) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    el.textContent = message;
    toastStack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      setTimeout(() => el.remove(), 220);
    }, 4500);
  }

  // `.bubble` usa white-space:pre-wrap (preserva quebra de linha digitada
  // pelo usuário) — isso também preserva, como espaço em branco VISÍVEL, a
  // indentação/quebra de linha "de formatação" dos templates multi-linha
  // abaixo. `>\s+<` cobre espaço entre DUAS tags, mas não cobre
  // tag-seguida-de-TEXTO — exatamente o caso de uma mensagem de texto
  // simples (o `${quotedHtml}` vazio deixa uma linha de espaços entre
  // `<div class="bubble">` e o texto, que não é tag, é conteúdo puro).
  // `>\s*\n\s*` cobre tag-seguida-de-quebra-de-linha ANTES de texto, sem
  // tocar quebra/espaço que esteja DENTRO do texto de verdade (só ocorre
  // logo após um `>` de fechamento de tag). Mesmo fix de chat.html.
  function compactHtml(html) {
    return html.replace(/>\s+</g, '><').replace(/>[ \t]*\n\s*/g, '>');
  }

  function initials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function formatDayLabel(iso) {
    const d = new Date(iso);
    const today = new Date();
    const yesterday = new Date(Date.now() - 86400000);
    const sameDay = (a, b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return 'Hoje';
    if (sameDay(d, yesterday)) return 'Ontem';
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long' });
  }

  function renderState(type, opts = {}) {
    const icons = {
      error: `<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`,
      empty: `<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
      nophone: `<svg class="state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>`,
    };
    app.innerHTML = `
      <div class="state-screen">
        ${icons[type] || icons.empty}
        <h3>${opts.title || ''}</h3>
        <p>${opts.desc || ''}</p>
        ${opts.retry ? `<button class="retry-btn" id="retryBtn">Tentar novamente</button>` : ''}
      </div>
    `;
    if (opts.retry) {
      document.getElementById('retryBtn').addEventListener('click', opts.retry);
    }
  }

  // ---------------------------------------------------------
  // Renderização do chat
  // ---------------------------------------------------------
  function renderChat() {
    app.innerHTML = `
      <div class="chat-header">
        <div class="avatar">${initials(state.contactName)}</div>
        <div class="header-info">
          <div class="name">${escapeHtml(state.contactName || 'Sem nome')}</div>
          <div class="meta">
            <span class="status-dot ${state.connectionStatus}"></span>
            <span id="statusLabel">${statusLabel()}</span>
            <span>· ${escapeHtml(state.phone || '')}</span>
          </div>
        </div>
        <div class="header-actions">
          ${state.cardGroup ? `
            <div class="view-switch" id="viewSwitch">
              <button type="button" data-view="client" class="${state.viewMode === 'client' ? 'active' : ''}">Cliente</button>
              <button type="button" data-view="group" class="${state.viewMode === 'group' ? 'active' : ''}">Grupo</button>
            </div>
          ` : (state.entityType === 'deal' ? `
            <button class="icon-btn" id="createGroupBtn" title="Criar grupo de WhatsApp com Responsável, Verificação e cliente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </button>
          ` : '')}
          <button class="icon-btn${state.internalNotes.length ? ' has-notes' : ''}" id="notesBtn" title="Nota interna (não visível ao cliente)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </button>
          ${state.instances.length > 1 ? `
            <select class="instance-select" id="instanceSelect" title="Trocar instância de WhatsApp">
              ${state.instances.map((i) => `<option value="${escapeHtml(i.id)}" ${i.id === state.session ? 'selected' : ''}>${escapeHtml(i.label)}</option>`).join('')}
            </select>
          ` : ''}
          <button class="icon-btn theme-toggle-btn" id="themeToggleBtn" title="Alternar tema claro/escuro">
            <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
          </button>
          <button class="icon-btn" id="refreshBtn" title="Atualizar conversa">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
          </button>
          <button class="icon-btn" id="openCrmBtn" title="Abrir contato no CRM">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messagesEl"></div>

      ${state.connectionStatus === 'offline' ? `
        <div class="disconnected-banner">
          WhatsApp desconectado — as mensagens não serão entregues até reconectar.
        </div>
      ` : ''}

      <div class="reply-preview-bar" id="replyPreviewBar" hidden>
        <svg class="bar-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/></svg>
        <div class="reply-preview-body">
          <div class="reply-preview-author" id="replyPreviewAuthor"></div>
          <div class="reply-preview-text" id="replyPreviewText"></div>
        </div>
        <button class="icon-btn" id="replyCancelBtn" title="Cancelar resposta" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <div class="composer">
        <button class="icon-btn" id="attachBtn" title="Enviar imagem, áudio, vídeo ou documento" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.41 17.42a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg>
        </button>
        <input type="file" id="mediaInput" style="display:none" />
        <textarea id="msgInput" placeholder="Escreva uma mensagem…" rows="1"></textarea>
        <button class="icon-btn" id="micBtn" title="Gravar áudio" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><path d="M12 18v4"/><path d="M8 22h8"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composerHint">Enter envia · Shift+Enter quebra linha</div>
      <div class="credit-row">
        <a class="credit-badge" href="https://www.linkedin.com/in/gabriel-alves-787208250/" target="_blank" rel="noopener">
          <span class="dot"></span> Desenvolvido por Gabriel Alves
        </a>
      </div>
    `;

    renderMessages();
    bindComposer();
    bindMessagesInteractions();
    renderReplyPreview();

    // Toggle de tema claro/escuro (2026-08-30) — mesmo mecanismo das
    // outras telas (localStorage puro, data-theme no <html>), botão no
    // header do mini-chat em vez de sidebar (esta página não tem uma —
    // é o card embutido no iframe do Bitrix). renderChat() recria o DOM
    // inteiro a cada render, então o listener é religado aqui sempre,
    // sem acumular (mesmo padrão de refreshBtn/openCrmBtn logo abaixo).
    const themeToggleBtnEl = document.getElementById('themeToggleBtn');
    if (themeToggleBtnEl) {
      themeToggleBtnEl.classList.toggle('light-active', document.documentElement.getAttribute('data-theme') === 'light');
      themeToggleBtnEl.addEventListener('click', () => {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (isLight) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('theme', 'light');
        }
        themeToggleBtnEl.classList.toggle('light-active', !isLight);
      });
    }
    document.getElementById('refreshBtn').addEventListener('click', () => loadHistory());
    document.getElementById('openCrmBtn').addEventListener('click', () => {
      if (!window.BX24) return;
      // Abre o card certo dependendo de onde esta aba foi carregada (HANDOFF
      // Parte DE) — antes sempre assumia Negócio, quebraria (URL com "null")
      // se clicado dentro da aba de Contato.
      const path = state.entityType === 'contact'
        ? '/crm/contact/details/' + state.contactId + '/'
        : '/crm/deal/details/' + state.dealId + '/';

    });
    const instanceSelectEl = document.getElementById('instanceSelect');

    const createGroupBtn = document.getElementById('createGroupBtn');
    if (createGroupBtn) createGroupBtn.addEventListener('click', () => openCreateGroupModal());

    const viewSwitch = document.getElementById('viewSwitch');
    if (viewSwitch) {
      viewSwitch.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => switchViewMode(btn.dataset.view));
      });
